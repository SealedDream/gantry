[package]
name = "bastion-ffi"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]
name = "bastion_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
# Binding generation only (apps/macos/build-core.sh). Library consumers
# (core-cabi, ui-tauri) must not compile the generator, clap or camino.
required-features = ["bindgen"]

[dependencies]
bastion-core = { path = "../core" }
uniffi = "0.32"
thiserror = "2"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
russh = "0.65.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# Tests only: writes the synthetic KeePass files of the B8 import test (already in the tree through bastion-core).
keepass = { version = "0.17", features = ["save_kdbx4"] }
tempfile = "3"

[features]
test-hooks = ["bastion-core/test-hooks"]
bindgen = ["uniffi/cli"]
