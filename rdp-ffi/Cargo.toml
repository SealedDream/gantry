[package]
name = "bastion-rdp"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"

# Standalone on purpose: IronRDP's picky pins curve25519-dalek 5.0.0-rc.1, which cannot coexist with
# russh in bastion-core's graph. Built as its own dynamic library next to bastion-ffi.
[lib]
crate-type = ["cdylib", "lib"]
name = "bastion_rdp"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-input = "0.9"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["rustls"] }
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
ironrdp-egfx = { version = "0.5", features = ["openh264-libloading"] }
# Fetching Cisco's OpenH264 (plain HTTP, .bz2) for Windows and the Tauri helper; pure Rust.
ureq = { version = "3", default-features = false }
bzip2 = "0.6"
ironrdp-svc = "0.10"
ironrdp-core = "0.3"
ironrdp-cliprdr = "0.9"
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
ironrdp-rdpsnd = "0.11"
# PCM playback through CoreAudio (cpal) only: no Opus/AAC codec builds.
ironrdp-rdpsnd-native = { version = "0.8", default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ironrdp-rdpdr-native 0.9.0 with one fix: the Nix drive backend answers every directory listing
# class, not only FileBothDirectoryInformation (see vendor/ironrdp-rdpdr-native/BASTION-PATCH.md).
[patch.crates-io]
ironrdp-rdpdr-native = { path = "vendor/ironrdp-rdpdr-native" }
