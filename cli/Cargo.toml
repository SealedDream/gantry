[package]
name = "bastion-cli"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
bastion-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
sha2 = "0.11.1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
