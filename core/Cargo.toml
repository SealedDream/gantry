[package]
name = "bastion-core"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
russh = "0.65.0"
tokio = { version = "1.54.1", features = ["full"] }
sha2 = "0.11.1"
# The plugin helper's pipe protocol only; Wasmtime stays in the helper program (PLUG-02b).
bastion-plugin-host = { path = "../plugin-host", default-features = false }
hex = "0.4.3"
alacritty_terminal = "0.26"
portable-pty = "0.9"
russh-sftp = "3"
vnc-rs = "0.6"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
base64 = "0.22"
# SOAP session login templates (design D): already in the dependency tree.
quick-xml = "0.42"
sha2_010 = { package = "sha2", version = "0.10" }
ed25519-dalek = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
# FTPS (explicit TLS) client; plain FTP is never offered.
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "rustls-ring"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
keepass = "0.17"
# Database client step 1 (PostgreSQL over a Bastion tunnel); `connect_raw` only, no runtime feature.
tokio-postgres = { version = "0.7", default-features = false }
# Plugin packages (core/src/plugin): the manifest is TOML; package entries are inflated in
# bounded steps. Both were already in the dependency tree of the shipped apps.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serialport = { version = "4", default-features = false }

[dev-dependencies]
# Tests only: turns on `HostKeyPolicy::AcceptNew` for the fixtures (see [features]).
bastion-core = { path = ".", features = ["test-accept-new"] }
keepass = { version = "0.17", features = ["save_kdbx4"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tempfile = "3"
rcgen = "0.13"
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Foundation", "Win32_System_Memory", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Crash/fault hooks for the UI driver suites only (store::write_atomic kill-mid-write). Release
# bundles never enable it: build-core.sh turns it on only with BASTION_TEST_HOOKS=1.
test-hooks = []
# `HostKeyPolicy::AcceptNew` (trust any unknown host key) for test fixtures only (SEC-07). Only
# dev-dependencies name it, so no app or release build has the variant.
test-accept-new = []
