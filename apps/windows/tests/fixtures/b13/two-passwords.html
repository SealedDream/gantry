<!doctype html><html><head><meta charset="utf-8"><title>B13 two passwords</title></head><body>
<h1>B13 two passwords</h1><form><input name="username"><input type="password" name="a"><input type="password" name="b"></form>
<p id="s">fill-status</p>
<script>setInterval(function(){var u=document.querySelector("input[name=username]"),p=document.querySelectorAll("input[type=password]");var n=0;p.forEach(function(x){n+=x.value.length});document.getElementById("s").textContent="fill-status user="+(u&&u.value?u.value:"-")+" pass-length="+n},200)</script>
</body></html>
