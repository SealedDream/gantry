# Kubernetes plugin. The library (`api`, `model`) is pure and tested against recorded API JSON
# (tests/fixtures). With the `plugin` feature it is also the plugin component:
#   cargo build --release --target wasm32-wasip2 --features plugin
# It talks to the API server only through the core's `http` interface (plugin API 1.4).
[package]
name = "bastion-plugin-kubernetes"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin = ["dep:bastion-plugin-sdk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bastion-plugin-sdk = { path = "../../sdk", optional = true }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1
lto = true

# Its own workspace, like plugins/template.
[workspace]
