# VMware plugin (PLUG-VMW-01): vCenter over REST, standalone ESXi over SOAP (VMW-ESXI). The library (`api`, `model`) is pure and tested against a
# mock API. With the `plugin` feature it is also the plugin component: built with
#   cargo build --release --target wasm32-wasip2 --features plugin
# it talks to the server only through the core's `http` interface (plugin API 1.1,
# docs/specs/plugins-amendment-2.md).
[package]
name = "bastion-plugin-vmware"
version = "0.5.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin = ["dep:bastion-plugin-sdk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SOAP answers of a standalone ESXi host (design D).
quick-xml = "0.42"
bastion-plugin-sdk = { path = "../../sdk", optional = true }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1
lto = true

# Its own workspace, like plugins/template.
[workspace]
