[package]
name = "bastion-plugin-testhost"
description = "Runs a Bastion plugin component with a fake core: views as text, a fake server and login."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bastion-plugin-sdk = { path = "../sdk" }
# The same Wasmtime as the PLUG-01 helper (the LTS line).
wasmtime = { version = "=48.0.9", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
getrandom = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
